substitutions:
  _IMAGE: us-central1-docker.pkg.dev/$PROJECT_ID/forge-physical/web:manual
  _API_URL: https://forge-api-rldj6ghw7q-uc.a.run.app

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/web/Dockerfile
      - --build-arg
      - NEXT_PUBLIC_BUILD_API_URL=${_API_URL}
      - -t
      - ${_IMAGE}
      - .
  - name: gcr.io/cloud-builders/docker
    args: [push, '${_IMAGE}']

images: ['${_IMAGE}']

options:
  logging: CLOUD_LOGGING_ONLY
