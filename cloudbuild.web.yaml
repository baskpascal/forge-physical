substitutions:
  _IMAGE: us-central1-docker.pkg.dev/$PROJECT_ID/forge-physical/web:manual
  _CACHE_IMAGE: us-central1-docker.pkg.dev/$PROJECT_ID/forge-physical/web:cache
  _API_URL: https://forge-api-rldj6ghw7q-uc.a.run.app

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker pull '${_CACHE_IMAGE}' || true
        docker build --cache-from '${_CACHE_IMAGE}' -f apps/web/Dockerfile --build-arg NEXT_PUBLIC_BUILD_API_URL='${_API_URL}' -t '${_IMAGE}' -t '${_CACHE_IMAGE}' .
  - id: push
    name: gcr.io/cloud-builders/docker
    waitFor: [build]
    args: [push, '${_IMAGE}']
  - id: cache
    name: gcr.io/cloud-builders/docker
    waitFor: [build]
    entrypoint: bash
    args: [-ceu, "docker push '${_CACHE_IMAGE}' || true"]

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
