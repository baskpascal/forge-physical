      .title{font:700 42px Arial;fill:#f8fafc}.sub{font:20px Arial;fill:#94a3b8}.box{fill:#13243d;stroke:#38bdf8;stroke-width:2;rx:16;filter:url(#shadow)}
      .tool{fill:#1e293b;stroke:#a78bfa}.evidence{fill:#11332f;stroke:#34d399}.boundary{fill:#2b1d37;stroke:#f472b6}
