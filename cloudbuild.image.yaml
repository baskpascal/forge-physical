substitutions:
  _TARGET: worker-runtime

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - services/build-worker/Dockerfile
      - --target
      - '${_TARGET}'
      - -t
      - '${_IMAGE}'
      - .
  - name: gcr.io/cloud-builders/docker
    args: [push, '${_IMAGE}']

images: ['${_IMAGE}']

options:
  logging: CLOUD_LOGGING_ONLY
