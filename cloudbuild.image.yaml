substitutions:
  _TARGET: worker-runtime
  _TOOLCHAIN_IMAGE: us-central1-docker.pkg.dev/$PROJECT_ID/forge-physical/coup-worker-toolchain:v2-pio6.1.19-esp32-6.12.0-wokwi0.26.1
  _CACHE_IMAGE: us-central1-docker.pkg.dev/$PROJECT_ID/forge-physical/worker:cache

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker pull '${_CACHE_IMAGE}' || true
        docker build --cache-from '${_CACHE_IMAGE}' --build-arg BUILDKIT_INLINE_CACHE=1 --build-arg 'TOOLCHAIN_IMAGE=${_TOOLCHAIN_IMAGE}' -f services/build-worker/Dockerfile --target '${_TARGET}' -t '${_IMAGE}' -t '${_CACHE_IMAGE}' .
  - id: push
    name: gcr.io/cloud-builders/docker
    waitFor: [build]
    args: [push, '${_IMAGE}']
  - id: cache
    name: gcr.io/cloud-builders/docker
    waitFor: [build]
    entrypoint: bash
    args: [-ceu, "docker push '${_CACHE_IMAGE}' || true"]

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
