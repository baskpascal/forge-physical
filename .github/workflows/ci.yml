name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -e 'services/build-worker[dev]'
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run backend:test
      - run: python -m ruff check scripts/run-backend.py services/build-worker/src services/build-worker/tests
